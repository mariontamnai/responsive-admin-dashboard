<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="container">
        <!--Login Section-->
        <div class="login-section">
            <h1>Welcome back</h1>
            <p>Please Enter your Account Details</p>

            <form>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your password">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">

                <a href="#" class="forgot-password">Forgot Password</a>
                <button type="submit" class="sign-in-button">Sign in</button>
            </form>
            <div class="social-icons">
                <i class="fab fa-google"></i>
                <i class="fab fa-github"></i>
                <i class="fab fa-facebook"></i>
                <i class="fab fa-twitter"></i>
            </div>
            <a href="#" class="create-account">Create an account</a>
        </div>
        <div class="testimonial-section">
            <h2>What's our Shoppers Said.</h2>
            <blockquote>
                "Shopping made easier"
            </blockquote>
            <p class="author">John Doe <span>UI Designer @ Google</span></p>

            <div class="navigation-buttons">
                <button class="nav-button"><i class="fas fa-arrow-left"></i></button>
                <button class="nav-button"><i class="fas fa-arrow-right"></i></button>
            </div>

            <div class="promotion">
                <h3>Get all you need in one place</h3>
                <p>Be our esteemed Shoppers</p>
            </div>
        </div>

    </div>

</body>

</html>
