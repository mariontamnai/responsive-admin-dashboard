<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Registration Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

</head>

<body>
    <div class="container">
        <div class="login-box">
            <div class="left-panel">
                <h1>Welcome Back!</h1>
                <p>We are delighted to have you as our shoppers.</p>
                <div class="dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
            <div class="right-panel">
                <h2>Sign in To Your Account</h2>
                <p>Open Your Account in seconds. Don't have an account? <a href="" class="signup-link">Sign up</a></p>
                <form action="#">
                    <div class="input-group">
                        <input type="text" placeholder="First Name" required>
                        <input type="text" placeholder="Last Name" required>
                    </div>
                    <input type="email" placeholder="Email Address" required>
                    <input type="password" autocomplete="new-password" placeholder="Password" required>

                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember"> Remember Me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <div class="or">or</div>
                    <div class="google-signin-container">
                        <button class="google-signin-btn">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                                alt="Google Logo" class="google-logo">
                            Sign in with Google
                        </button>
                    </div>

                    <div class="social-login">
                        <a href="https://facebook.com/yourprofile" target="_blank" class="facebook">
                            <i class="bi bi-facebook"></i>
                        </a>
                        <a href="https://twitter.com/yourprofile" target="_blank" class="twitter">
                            <i class="bi bi-twitter"></i>
                        </a>
                        <a href="https://instagram.com/yourprofile" target="_blank" class="instagram">
                            <i class="bi bi-instagram"></i>
                        </a>
                        <a href="https://github.com/yourprofile" target="_blank" class="github">
                            <i class="bi bi-github"></i>
                        </a>
                        <a href="https://apple.com/yourprofile" target="_blank" class="apple">
                            <i class="bi bi-apple"></i>
                        </a>
                        <a href="https://linkedin.com/yourprofile" target="_blank" class="linkedin">
                            <i class="bi bi-linkedin"></i>
                        </a>
                    </div>
                    <button type="submit" class="login-btn">Sign In</button>
            </div>
            </form>
        </div>
    </div>
    </div>
</body>

</html>
